# The website on claudius.devlato.com: the files `cargo xtask site` writes to target/site, served by Cloudflare as a
# Worker's static assets, with _headers and _redirects. `npx wrangler deploy --config site/wrangler.toml` publishes a
# build; .github/workflows/site.yml does it for main. The custom domain comes with its DNS record.
#
# The Worker (worker/index.js) answers only the studio demo's samples (searched and fetched from free libraries, a visitor's
# searches limited by SEARCHES) and the relay between the demo and a phone (a Durable Object, worker/room.js); every
# other path is a static asset.
name = "claudius-site"
main = "worker/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false
routes = [{ pattern = "claudius.devlato.com", custom_domain = true }]

[assets]
directory = "../target/site"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/studio/samples/*", "/relay/*"]

# a room of the relay for each demo a phone plays along with
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# the searches a visitor may ask Openverse for in a minute, beyond what the edge has kept: a song asks for a few
[[ratelimits]]
name = "SEARCHES"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[observability]
enabled = false
