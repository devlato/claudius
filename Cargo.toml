[workspace]
resolver = "3"
members = ["crates/claudius", "crates/earshot", "crates/claudius-api", "crates/claudius-decode", "crates/claudius-encode", "crates/claudius-ui", "crates/claudius-packs", "crates/claudius-server", "crates/claudius-session", "crates/claudius-web", "crates/claudius-cli", "crates/claudius-intent", "xtask"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"
authors = ["The claudius authors"]
repository = "https://github.com/devlato/claudius"
homepage = "https://github.com/devlato/claudius"
readme = "README.md"
rust-version = "1.96"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# what CI counts the instructions of (`cargo xtask perf`): the release's optimisations without its link-time ones,
# which only make the build slower
[profile.perf]
inherits = "release"
lto = false
codegen-units = 16
strip = false
