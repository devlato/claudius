[package]
name = "xtask"
description = "The repository's chores: CI checks, the web studio, docs, the website, release archives and release PRs"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# the logo and its icons (`cargo xtask icons`): drawn, encoded, and the wordmark outlined from the studio's font
epaint_default_fonts = "0.37"
png = "0.18"
skrifa = "0.44"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
anyhow = "1"
claudius-intent = { path = "../crates/claudius-intent" }
serde_json = "1"
sha2 = "0.11"
xshell = "0.2"
