# Builds the installable packages, unsigned, on a pull request that changes how they are made, and checks that each
# one installs and runs: the macOS app in its disk image, the Windows installer, and the Linux .deb, .rpm and
# AppImage (scripts/package/). release.yml makes the same packages for a release, and signs the Mac app when it has
# the keys.
name: packages

on:
  pull_request:
    paths:
      - packaging/**
      - scripts/package/**
      - .github/workflows/packages.yml
      - .github/workflows/release.yml
      - xtask/src/dist.rs
      - crates/claudius-cli/src/bin/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  macos:
    name: macOS app
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          targets: x86_64-apple-darwin
          cache-key: packages-macos
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: trunk@0.21.14
      - run: cargo xtask web
      - run: cargo xtask dist --target aarch64-apple-darwin --web crates/claudius-ui/dist
      - run: cargo xtask dist --target x86_64-apple-darwin --web crates/claudius-ui/dist
      - name: claudius.app and its disk image
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          sh scripts/package/macos.sh "target/dist/claudius-$version-aarch64-apple-darwin.tar.gz" \
            "target/dist/claudius-$version-x86_64-apple-darwin.tar.gz" target/packages
      - name: Installed from the disk image, the app opens the studio
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/volume" target/packages/*.dmg
          mkdir "$RUNNER_TEMP/Applications"
          cp -R "$RUNNER_TEMP/volume/claudius.app" "$RUNNER_TEMP/Applications/"
          hdiutil detach "$RUNNER_TEMP/volume"
          app=$RUNNER_TEMP/Applications/claudius.app
          codesign --verify --strict --deep "$app"
          lipo -archs "$app/Contents/MacOS/claudius" | tee /dev/stderr | grep -q "x86_64 arm64"
          "$app/Contents/MacOS/claudius" --version
          # as Finder opens it: no arguments, so the program starts the studio, and with it the engine
          open -g "$app"
          for _ in $(seq 60); do
            if curl -fsS -H "Host: localhost" http://127.0.0.1:7878/api/hello; then break; fi
            sleep 2
          done
          curl -fsS -H "Host: localhost" http://127.0.0.1:7878/api/hello > /dev/null
          pgrep -f "claudius.app/Contents/MacOS/claudius"
          pkill -f "claudius.app/Contents/MacOS/claudius"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-app
          path: target/packages/*.dmg
          retention-days: 3

  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache-key: packages-windows
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: trunk@0.21.14
      - run: cargo xtask web
      - run: cargo xtask dist --target x86_64-pc-windows-msvc --web crates/claudius-ui/dist
      - name: The installer
        run: |
          dotnet tool install --global wix --version 5.0.2
          export PATH="$HOME/.dotnet/tools:$PATH"
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          pwsh scripts/package/windows.ps1 "target/dist/claudius-$version-x86_64-pc-windows-msvc.zip" target/packages
      - name: Installed, the programs are on PATH and the Start menu entry runs the studio's program
        shell: pwsh
        run: |
          $msi = (Get-ChildItem target/packages/*.msi).FullName
          $log = Join-Path $env:RUNNER_TEMP 'install.log'
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', "`"$log`""
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 60; throw "msiexec /i exited with $($p.ExitCode)" }
          $bin = Join-Path $env:LOCALAPPDATA 'Programs\claudius\bin'
          & (Join-Path $bin 'claudius.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'the installed claudius.exe does not run' }
          $path = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($path -notlike "*$bin*") { throw "the user's PATH has no $bin`: $path" }
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\claudius.lnk'
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
          if ($target -ne (Join-Path $bin 'claudius-studio.exe')) { throw "the Start menu entry points at '$target'" }
          # the runners have no OpenGL 3, so the window itself cannot open here: --help shows that the program the
          # Start menu runs finds claudius.exe and starts `claudius studio`
          $p = Start-Process $target -ArgumentList '--help' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "claudius-studio.exe --help exited with $($p.ExitCode)" }
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList '/x', "`"$msi`"", '/qn'
          if ($p.ExitCode -ne 0) { throw "msiexec /x exited with $($p.ExitCode)" }
          if (Test-Path (Join-Path $bin 'claudius.exe')) { throw 'uninstalling left claudius.exe behind' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: target/packages/*.msi
          retention-days: 3

  linux:
    name: Linux packages
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache-key: packages-linux
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: trunk@0.21.14
      - run: cargo xtask web
      - run: cargo xtask dist --target x86_64-unknown-linux-gnu --web crates/claudius-ui/dist
      - name: The packages
        run: |
          sudo apt-get install -y -qq --no-install-recommends rpm desktop-file-utils
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          sh scripts/package/linux.sh "target/dist/claudius-$version-x86_64-unknown-linux-gnu.tar.gz" target/packages
      - name: Each one installs and runs
        working-directory: target/packages
        run: |
          # the .deb on Debian 13, with the libraries apt brings for it
          docker run --rm -v "$PWD:/packages:ro" debian:trixie sh -ec '
            apt-get update -qq && apt-get install -y -qq /packages/claudius-*.deb > /dev/null
            claudius --version
            test -f /usr/share/claudius/web/index.html && test -f /usr/share/applications/claudius-studio.desktop'
          # the .rpm on Fedora
          docker run --rm -v "$PWD:/packages:ro" fedora:42 sh -ec '
            dnf install -y -q /packages/claudius-*.rpm > /dev/null
            claudius --version
            test -f /usr/share/claudius/web/index.html'
          # the AppImage here, extracted instead of mounted
          for appimage in claudius-*.AppImage; do
            chmod +x "$appimage"
            "./$appimage" --appimage-extract-and-run --version
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: |
            target/packages/*.deb
            target/packages/*.rpm
            target/packages/*.AppImage
          retention-days: 3
