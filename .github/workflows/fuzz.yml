# Runs every cargo-fuzz target in fuzz/fuzz_targets/ for a few minutes each week, on nightly. The corpus is kept in
# the Actions cache between runs, and inputs that crash are uploaded as artifacts.
name: fuzz

on:
  schedule:
    - cron: "41 3 * * 6" # Saturdays, 03:41 UTC
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "300"
        type: string

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  targets:
    name: find targets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: |
          targets=$(for file in fuzz/fuzz_targets/*.rs; do [ -e "$file" ] && basename "$file" .rs; done | jq -Rnc '[inputs]')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          if [ "$targets" = "[]" ]; then
            echo "::notice title=fuzz::There are no targets in fuzz/fuzz_targets/ yet."
          fi

  fuzz:
    name: fuzz ${{ matrix.target }}
    needs: targets
    if: needs.targets.outputs.targets != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    env:
      # cargo-fuzz needs nightly; this overrides rust-toolchain.toml for every step, the setup included
      RUSTUP_TOOLCHAIN: nightly
      TARGET: ${{ matrix.target }}
      SECONDS_PER_TARGET: ${{ inputs.seconds || '300' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache-key: fuzz-${{ matrix.target }}
          # fuzz/ is a workspace of its own, with its own target directory
          cache-workspaces: fuzz -> target
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-fuzz@0.13.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      # cargo-fuzz defaults to the target it was built for, and the prebuilt one is a musl binary: libFuzzer's
      # sanitizer needs the dynamically linked glibc target
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu "$TARGET" -- -max_total_time="$SECONDS_PER_TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
