# Publishes a release when main has a version that is not released yet: that is, when a release PR from
# release-pr.yml was merged. A version counts as releasable when CHANGELOG.md has a section for it and there is no
# GitHub release for it. Running it by hand (workflow_dispatch) retries a release that failed halfway. It releases
# from main, or from a hotfix/v* branch, which only admins can push (docs/src/contributing/releasing.md).
#
# The tag vX.Y.Z is created when the release is published, after every required build has passed, so a failed run
# leaves nothing behind but a draft, which the next run replaces.
#
# No job here restores a cache, so a release links only what this run built and downloaded, and code that ran in
# another workflow cannot reach the archives. The jobs that hold tokens, publish and homebrew, run no cargo, and
# they run in the environment "release", which only main and the hotfix branches may use.
name: release

on:
  push:
    branches: [main]
    paths: [Cargo.toml, CHANGELOG.md]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  HOMEBREW_TAP: devlato/homebrew-tap

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Is this version released?
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          case $GITHUB_REF in
            refs/heads/main | refs/heads/hotfix/v*) ;;
            *)
              echo "::error title=release::releases are made from main or a hotfix/v* branch, not $GITHUB_REF."
              exit 1
              ;;
          esac
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          release=true
          if gh release view "v$version" --json isDraft --jq 'select(.isDraft | not)' | grep -q .; then
            echo "::notice title=release::claudius $version is already released."
            release=false
          elif ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::notice title=release::CHANGELOG.md has no section for $version, so this commit is not a release."
            release=false
          elif [ "$GITHUB_EVENT_NAME" = push ] && [[ "$HEAD_MESSAGE" != "release: v$version"* ]]; then
            echo "::error title=release::claudius $version is not released, and this commit is not the merge of its" \
              "release PR. Versions change only through release-pr.yml; if its release failed, run release.yml by hand."
            exit 1
          else
            # an empty list when there is no such tag; release tags are lightweight, so the ref names the commit
            tagged=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$version" \
              --jq ".[] | select(.ref == \"refs/tags/v$version\") | .object.sha")
            if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error title=release::the tag v$version points at $tagged, not at this commit ($GITHUB_SHA)."
              exit 1
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

  web:
    name: web studio
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache: "false"
          linux-packages: "false"
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: trunk@0.21.14
      - run: cargo xtask web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: crates/claudius-ui/dist
          if-no-files-found: error

  build:
    name: build (${{ matrix.target }})
    needs: [plan, web]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    # an experimental target that fails is left out of the release instead of stopping it
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        # xtask/src/dist.rs decides the features: the Intel Mac and Windows builds have no ears
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, experimental: false }
          - { target: x86_64-apple-darwin, os: macos-latest, experimental: false }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04, experimental: false }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, experimental: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, experimental: true }
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          targets: ${{ matrix.target }}
          cache: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: target/web
      - run: cargo xtask dist --target "$TARGET" --web target/web
      # for servers: no studio window, so no ALSA or X11; most of the build is reused from the step before
      - name: Headless archive
        if: runner.os == 'Linux'
        run: cargo xtask dist --target "$TARGET" --web target/web --headless
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: |
            target/dist/*.tar.gz
            target/dist/*.zip
            target/dist/*.sha256
            target/dist/*.sha256
          if-no-files-found: error

  notes:
    name: release notes
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache: "false"
          linux-packages: "false"
      - name: Release notes
        run: |
          mkdir -p target/notes
          {
            cargo xtask release notes "$VERSION"
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh | sh"
            echo '```'
            echo
            echo "On Windows: \`irm https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.ps1 | iex\`."
            echo "Or download an archive below."
            echo "The \`-headless\` Linux archives have no studio window and need neither ALSA nor a display;"
            echo "\`install.sh\` picks them when ALSA is missing, or with \`--headless\`. The Intel Mac and Windows"
            echo "builds have no ears: their verdicts use meters and music theory."
            echo
            echo "\`SHA256SUMS\` lists the checksums of the archives and the install scripts. This checks that an archive"
            echo "was built by this repository's release workflow, from ${GITHUB_REF#refs/heads/}:"
            echo
            echo '```sh'
            echo "gh attestation verify <archive> --repo $GITHUB_REPOSITORY \\"
            echo "  --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml --source-ref $GITHUB_REF"
            echo '```'
          } > target/notes/notes.md
          cat target/notes/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: target/notes/notes.md
          if-no-files-found: error

  publish:
    name: publish v${{ needs.plan.outputs.version }}
    needs: [plan, build, notes]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write # the release and its tag
      id-token: write # signing the provenance attestation
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # each build into a folder of its own, so that one build cannot replace another's archive
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: ${{ runner.temp }}/builds
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: ${{ runner.temp }}/notes
      - name: Checksums
        run: |
          shopt -s nullglob
          mkdir dist
          for build in "$RUNNER_TEMP"/builds/dist-*; do
            target=${build##*/dist-}
            archive=claudius-$VERSION-$target
            for file in "$build"/*; do
              name=${file##*/}
              case $name in
                "$archive".tar.gz | "$archive"-headless.tar.gz | "$archive".zip) ;;
                "$archive".tar.gz.sha256 | "$archive"-headless.tar.gz.sha256 | "$archive".zip.sha256) ;;
                *)
                  echo "::error title=release::the $target build uploaded $name, which is not one of its archives."
                  exit 1
                  ;;
              esac
              mv -n "$file" dist/
            done
          done
          cd dist
          sums=(*.sha256)
          if [ "${#sums[@]}" -eq 0 ]; then
            echo "::error title=release::no build uploaded an archive."
            exit 1
          fi
          sha256sum --check --strict -- "${sums[@]}"
          rm -- "${sums[@]}"
          cp ../scripts/install.sh ../scripts/install.ps1 .
          sha256sum -- *.tar.gz *.zip install.sh install.ps1 > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish the release
        run: |
          if gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null | grep -q true; then
            gh release delete "v$VERSION" --yes
          fi
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" "${prerelease[@]}" \
            --title "claudius $VERSION" --notes-file "$RUNNER_TEMP/notes/notes.md" dist/*
          gh release edit "v$VERSION" --draft=false
          echo "### [claudius $VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION)" >> "$GITHUB_STEP_SUMMARY"

  homebrew:
    name: homebrew tap
    needs: [plan, publish]
    # pre-releases (0.5.0-rc.1) stay out of Homebrew and off the site
    if: ${{ !contains(needs.plan.outputs.version, '-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: No tap token
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo "::notice title=homebrew::HOMEBREW_TAP_TOKEN is not set, so $HOMEBREW_TAP was not updated."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HOMEBREW_TAP_TOKEN != ''
        with:
          persist-credentials: false
      - name: Update Formula/claudius.rb
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$VERSION" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          sum() { awk -v file="claudius-$VERSION-$1.tar.gz" '$2 == file { print $1 }' "$RUNNER_TEMP/SHA256SUMS"; }
          sed -e "s/{{version}}/$VERSION/g" \
            -e "s/{{sha256_aarch64_apple_darwin}}/$(sum aarch64-apple-darwin)/" \
            -e "s/{{sha256_x86_64_apple_darwin}}/$(sum x86_64-apple-darwin)/" \
            -e "s/{{sha256_x86_64_unknown_linux_gnu}}/$(sum x86_64-unknown-linux-gnu)/" \
            -e "s/{{sha256_aarch64_unknown_linux_gnu}}/$(sum aarch64-unknown-linux-gnu)/" \
            scripts/homebrew/claudius.rb.tmpl > "$RUNNER_TEMP/claudius.rb"
          if grep -q '{{' "$RUNNER_TEMP/claudius.rb"; then
            echo "::error title=homebrew::the formula still has placeholders"; grep -n '{{' "$RUNNER_TEMP/claudius.rb"; exit 1
          fi

          git clone --depth 1 "https://x-access-token:$HOMEBREW_TAP_TOKEN@github.com/$HOMEBREW_TAP.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Formula"
          cp "$RUNNER_TEMP/claudius.rb" "$RUNNER_TEMP/tap/Formula/claudius.rb"
          cd "$RUNNER_TEMP/tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/claudius.rb
          if git diff --cached --quiet; then echo "the formula is already up to date"; exit 0; fi
          git commit -m "claudius $VERSION"
          git push origin HEAD

  site:
    name: site
    needs: [plan, publish]
    if: ${{ github.ref == 'refs/heads/main' && !contains(needs.plan.outputs.version, '-') }}
    permissions:
      contents: read
    # the deploy job takes the Cloudflare secrets from the environment "site"
    uses: ./.github/workflows/site.yml
