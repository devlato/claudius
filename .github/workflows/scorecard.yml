# OpenSSF Scorecard scores the repository's supply-chain practices and publishes the result; public repositories only,
# so it runs once the repository variable REPO_IS_PUBLIC is true (scripts/github-setup.sh sets it).
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1" # Mondays, 05:41 UTC

permissions: {}

jobs:
  analysis:
    name: scorecard
    if: vars.REPO_IS_PUBLIC == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
      id-token: write # publish the results to the OpenSSF API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
