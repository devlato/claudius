# OpenSSF Scorecard scores the repository's supply-chain practices and publishes the result; public repositories only,
# so it runs once the repository variable REPO_IS_PUBLIC is true (scripts/github-setup.sh sets it).
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1" # Mondays, 05:41 UTC

permissions: {}

jobs:
  analysis:
    name: scorecard
    if: vars.REPO_IS_PUBLIC == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
      id-token: write # publish the results to the OpenSSF API
    # Publishing signs the results in Sigstore's transparency log, and an outage of the log fails the step (Rekor
    # answering 500 to all four of its tries, which took 15 s); GitHub's code-scanning upload fails now and then too.
    # So each is tried once more when it fails. This job may hold nothing but steps that use a few actions, so no `run`
    # step can wait in between (https://github.com/ossf/scorecard-action#workflow-restrictions).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: score
        continue-on-error: true
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - if: steps.score.outcome == 'failure'
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      # the results, which are written before they are published, reach code scanning even when publishing failed
      - id: upload
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
      - if: ${{ !cancelled() && steps.upload.outcome == 'failure' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
