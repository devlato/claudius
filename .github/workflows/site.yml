# Builds the website with `cargo xtask site` (the landing page, the book at /docs/, the studio at /studio/ and the
# install scripts) and deploys main's to Cloudflare, as the static assets of the Worker in site/wrangler.toml.
#
# The build runs without a cache and without secrets, and hands the site to the deploy job as an artifact. Deploying
# needs the site's address in the repository variable SITE_URL (https://...), and the secrets CLOUDFLARE_API_TOKEN
# and CLOUDFLARE_ACCOUNT_ID in the environment "site", which only main may use. Pull requests and forks build the
# site and deploy nothing.
name: site

on:
  push:
    branches: [main]
    paths: [docs/**, site/**, CHANGELOG.md, scripts/install.sh, scripts/install.ps1]
  pull_request:
    paths: [docs/**, site/**, CHANGELOG.md, scripts/install.sh, scripts/install.ps1]
  # release.yml, once a release is published
  workflow_call:
    inputs:
      after-release:
        type: boolean
        default: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: build
    # a merged release PR is deployed by release.yml after the release is out, so that the site never offers a
    # version that cannot be downloaded yet
    if: >-
      inputs.after-release || github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'release: v')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache: "false"
          linux-packages: "false"
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: trunk@0.21.14,mdbook@0.5.4
      - run: |
          if [ -n "$SITE_URL" ]; then set -- --site-url "$SITE_URL"; fi
          cargo xtask site --out target/site "$@"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          # the Worker's configuration comes along: its assets are ../target/site
          path: |
            target/site
            site/wrangler.toml
          if-no-files-found: error
      - name: Not deployed
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main' || vars.SITE_URL == ''
        run: >-
          echo "::notice title=site::The site was built but not deployed: main's is deployed, once the variable
          SITE_URL says where."

  deploy:
    name: deploy
    needs: build
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SITE_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    environment:
      name: site
      url: ${{ vars.SITE_URL }}
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: No Cloudflare credentials
        if: env.HAS_CLOUDFLARE != 'true'
        run: >-
          echo "::notice title=site::The site was not deployed: the environment site has no CLOUDFLARE_API_TOKEN and
          CLOUDFLARE_ACCOUNT_ID."
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.HAS_CLOUDFLARE == 'true'
        with:
          name: site
      - name: Deploy to Cloudflare
        id: deploy
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.149.0"
          command: deploy --config site/wrangler.toml
      - name: Summary
        if: steps.deploy.outcome == 'success'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: echo "Deployed main to $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
