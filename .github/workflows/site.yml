# Builds the website with `cargo xtask site` (the landing page, the book at /docs/, the studio at /studio/ and the
# install scripts) and deploys it to Cloudflare Pages: production from main, a preview on the branch pr-<number> for
# pull requests from this repository.
#
# Deploying needs an address for the site, the repository variables SITE_URL (https://...) and SITE_PROJECT (the
# Pages project), and the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets; without them (and in forks) the
# site is built but not deployed.
name: site

on:
  push:
    branches: [main]
    paths: [docs/**, site/**, CHANGELOG.md, scripts/install.sh, scripts/install.ps1]
  pull_request:
    paths: [docs/**, site/**, CHANGELOG.md, scripts/install.sh, scripts/install.ps1]
  # release.yml, once a release is published
  workflow_call:
    inputs:
      after-release:
        type: boolean
        default: true
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  site:
    name: build and deploy
    # a merged release PR is deployed by release.yml after the release is out, so that the site never offers a
    # version that cannot be downloaded yet
    if: >-
      inputs.after-release || github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'release: v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY: >-
        ${{ vars.SITE_URL != '' && vars.SITE_PROJECT != '' &&
        secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust
        with:
          cache-key: site
          linux-packages: "false"
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: trunk@0.21.14,mdbook@0.5.4
      - run: |
          if [ -n "$SITE_URL" ]; then set -- --site-url "$SITE_URL"; fi
          cargo xtask site --out target/site "$@"

      - name: Not deployed
        if: env.DEPLOY != 'true'
        run: >-
          echo "::notice title=site::The site was built but not deployed: it needs the variables SITE_URL and
          SITE_PROJECT and the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (forks and Dependabot get no
          secrets)."
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: env.DEPLOY == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy target/site --project-name=${{ vars.SITE_PROJECT }} --branch=${{ env.BRANCH }}
      - name: Summary
        if: steps.deploy.outcome == 'success'
        env:
          DEPLOYMENT: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: echo "Deployed $BRANCH to ${ALIAS:-$DEPLOYMENT} ($DEPLOYMENT)" >> "$GITHUB_STEP_SUMMARY"
