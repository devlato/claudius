[package]
name = "claudius-ui"
description = "The claudius studio UI (egui): runs natively and in the browser, talks to the claudius server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "claudius-ui"
path = "src/main.rs"

[dependencies]
claudius-api = { path = "../claudius-api" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "clipboard", "links", "persistence", "wayland", "x11"] }
ehttp = "0.7"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the demo's sounds (Ogg Vorbis), decoded in Rust: browsers before Safari 18.4 cannot
symphonia = { version = "0.6", default-features = false, features = ["ogg", "vorbis"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# the version rodio plays through: recording a take opens streams of its own
cpal = "0.18"
midir = "0.11"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
hound = "3"
rodio = { version = "0.23", default-features = false, features = ["playback"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Document", "Element", "HtmlAudioElement", "HtmlCanvasElement", "HtmlMediaElement", "Location", "MediaError", "Url", "Window"] }
