[package]
name = "claudius-ui"
description = "The claudius studio UI (egui): runs natively and in the browser, talks to the claudius server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "claudius-ui"
path = "src/main.rs"

[features]
# scripted runs in the browser, from the page's `?plan=` (as CLAUDIUS_UI_PLAN does natively): for tests only, since a
# link could otherwise drive the studio, the microphone included
plan = []

[dependencies]
claudius-api = { path = "../claudius-api" }
claudius-intent = { path = "../claudius-intent" }
# accesskit: the window's widgets for the system's screen reader; web_screen_reader: a page speaks what has focus
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "clipboard", "links", "persistence", "wayland", "web_screen_reader", "x11"] }
ehttp = "0.7"
# WAV in and out: the song a take is recorded over, and the take itself
hound = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
# the QR code a phone scans to play along
qrcodegen = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the settings a studio before claudius 0.6 kept, as eframe wrote them (`settings`)
ron = "0.12"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# the demo's engine, on a thread of its own (a page runs it in a Web Worker: crates/claudius-web)
claudius = { path = "../claudius", default-features = false }
claudius-session = { path = "../claudius-session" }
# the version rodio plays through: recording a take opens streams of its own
cpal = "0.18"
midir = "0.11"
# the system's own dialog for choosing a file (a browser's is its file input)
rfd = "0.17"
# the system's notifications, and its media keys and Now Playing (on Linux both over D-Bus with zbus, as AccessKit is)
notify-rust = { version = "4.19", default-features = false, features = ["z"] }
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
rodio = { version = "0.23", default-features = false, features = ["playback"] }

# the window's handle, which the media keys need on Windows
[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "AudioBuffer", "AudioBufferSourceNode", "AudioContext", "BinaryType", "CloseEvent", "Crypto", "Storage", "WebSocket", "AudioContextLatencyCategory", "AudioContextOptions",
  "AudioContextState", "AudioDestinationNode", "AudioNode", "AudioParam", "AudioScheduledSourceNode", "AudioWorklet",
  "AudioWorkletNode", "AudioWorkletNodeOptions", "BaseAudioContext", "Blob", "BlobPropertyBag", "ChannelCountMode",
  "console", "Document", "DomException", "Element", "Event", "File", "FileList", "GainNode", "HtmlAnchorElement",
  "HtmlAudioElement", "HtmlCanvasElement", "HtmlElement", "HtmlInputElement", "HtmlMediaElement", "Location",
  "MediaDeviceInfo", "MediaDeviceKind", "MediaDevices", "MediaError", "MediaStream", "MediaStreamAudioSourceNode",
  "MediaStreamConstraints", "MediaStreamTrack", "MediaTrackSettings", "MessageEvent", "MessagePort", "MidiAccess",
  "MidiInput", "MidiInputMap", "MidiMessageEvent", "MidiPort", "Navigator", "Node", "NodeList", "OscillatorNode",
  "OscillatorType", "Performance", "Url", "UrlSearchParams", "Window", "Worker", "Worklet",
] }
