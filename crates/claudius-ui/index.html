  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#101217" />
  <title>Claudius</title>
  <link data-trunk rel="rust" data-bin="claudius-ui" data-wasm-opt="2" />
  <!-- the demo's engine, in a Web Worker of its own: the studio's songs made and rendered in the page -->
  <link data-trunk rel="rust" href="../claudius-web/Cargo.toml" data-bin="claudius-engine" data-type="worker" data-loader-shim data-wasm-opt="2" />
  <!-- the recorder's AudioWorklet, loaded from beside the page -->
  <link data-trunk rel="copy-file" href="record-worklet.js" />
  <script>
    // The look the studio wears, as its settings keep it (src/settings.rs): the page is drawn in it from the start, so
    // it does not change colour when the studio arrives.
    try {
      const kept = JSON.parse(localStorage.getItem("settings") || "{}");
      let look = kept.look;
      if ((kept.version || 0) < 2 && look === "system") look = "dark";
      if (look === "system") look = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      if (look === "light") {
        document.documentElement.dataset.look = "light";
        document.querySelector('meta[name="theme-color"]').content = "#e5e8ee";
      }
    } catch (_) {}
  </script>
  <style>
    :root { --bg: #101217; --panel: #171a20; --tools: #15171d; --status: #14161c; --block: #232731; --well: #0b0d11;
      --line: #2e333e; --line-soft: #1f232b; --text: #dde1e8; --dim: #8f97a4; --accent: #ffa348; --bad: #f05e56;
      --lcd: #090f11; --shadow: rgba(0, 0, 0, 0.4); }
    :root[data-look="light"] { --bg: #e5e8ee; --panel: #f1f3f6; --tools: #edeff3; --status: #ebeef2; --block: #d8dde5;
      --well: #ffffff; --line: #c4cad4; --line-soft: #dadfe6; --text: #181c24; --dim: #4c5462; --accent: #b45600;
      --bad: #c42822; --shadow: rgba(24, 28, 36, 0.12); }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
    #claudius_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }

    /* The studio's outline while its program arrives, laid out as the studio lays itself out (src/app.rs): the
       transport and the toolbar across the top, the inspector on the right, the arrangement with the dock under it,
       and the status line. The canvas takes its place once the studio runs. */
    #loading { position: absolute; inset: 0; display: grid; overflow: hidden; pointer-events: none; color: var(--dim);
      background: var(--bg); font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      grid-template-rows: 58px 40px minmax(0, 1fr) clamp(200px, calc((100vh - 122px) * 0.38), 360px) 24px;
      grid-template-columns: minmax(0, 1fr) 350px; }
    #loading i { display: block; flex: none; border-radius: 4px; background: var(--block); }
    #loading .grow { flex: 1; }
    #loading .transport, #loading .toolbar, #loading .status { grid-column: 1 / -1; display: flex; align-items: center;
      gap: 6px; padding: 0 12px; }
    #loading .transport { background: var(--panel); }
    #loading .toolbar { background: var(--tools); border-top: 1px solid var(--line-soft);
      border-bottom: 1px solid var(--line-soft); }
    #loading .status { grid-row: 5; background: var(--status); border-top: 1px solid var(--line-soft); }
    #loading .logo { display: flex; align-items: center; gap: 8px; margin-right: 12px; color: var(--text);
      font-size: 19px; font-weight: 600; }
    #loading .logo::before { content: ""; width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%;
      border: 4px solid var(--accent); border-right-color: transparent; transform: rotate(-45deg); }
    #loading .key { width: 30px; height: 30px; border-radius: 6px; }
    #loading .lcd { display: flex; align-items: center; width: 200px; height: 44px; margin: 0 8px; padding: 0 12px;
      box-sizing: border-box; border-radius: 6px; background: var(--lcd); border: 1px solid var(--line);
      color: rgba(132, 232, 255, 0.45); font: 22px ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    #loading .two { display: flex; flex-direction: column; gap: 7px; margin-right: 10px; }

    #loading .arrangement { grid-row: 3; grid-column: 1; display: flex; flex-direction: column; padding: 6px 10px 0;
      overflow: hidden; }
    #loading .head { display: flex; align-items: center; gap: 8px; height: 24px; }
    #loading .caps { font-size: 10.5px; letter-spacing: 0.06em; }
    #loading .lane { display: flex; align-items: center; height: 30px; flex: none; }
    #loading .lane > :first-child { display: flex; align-items: center; gap: 8px; width: 138px; flex: none; }
    #loading .lane > :first-child::before { content: ""; width: 3px; height: 16px; border-radius: 2px;
      background: var(--c, transparent); }
    #loading .clips { display: flex; flex: 1; gap: 2px; height: 22px; }
    #loading .clips i { height: 100%; flex: var(--n); background: var(--c); opacity: 0.4; }
    #loading .clips .off { background: none; }
    #loading .ruler { height: 18px; margin-left: 138px; flex: none;
      background: repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px calc(100% / 15)); }
    #loading .sections { height: 40px; }
    #loading .sections .clips { height: 34px; }
    #loading .sections .clips i { opacity: 0.55; }
    #loading .master { height: 96px; margin: 18px 0 0 138px; flex: none; opacity: 0.4;
      background: linear-gradient(90deg, #4a7aba 0 13.3%, #2ea6a0 0 26.7%, #8a68cc 0 33.3%, #dea63e 0 40%,
        #e8524e 0 93.3%, #626e88 0);
      -webkit-mask: repeating-linear-gradient(90deg, #000 0 2px, transparent 0 3px),
        linear-gradient(transparent 8%, #000 38%, #000 62%, transparent 92%);
      -webkit-mask-composite: source-in;
      mask: repeating-linear-gradient(90deg, #000 0 2px, transparent 0 3px) intersect,
        linear-gradient(transparent 8%, #000 38%, #000 62%, transparent 92%); }

    #loading .dock { grid-row: 4; grid-column: 1; display: flex; flex-direction: column; padding: 0 12px;
      background: var(--panel); border-top: 1px solid var(--line); overflow: hidden; }
    #loading .tabs { display: flex; align-items: center; gap: 22px; height: 34px; flex: none;
      border-bottom: 1px solid var(--line-soft); }
    #loading .tabs i { height: 10px; }
    #loading .tabs i:first-child { background: var(--accent); opacity: 0.5; }
    #loading .variant { display: flex; align-items: center; gap: 10px; height: 34px; flex: none; }
    #loading .dock .lane > :first-child { width: 168px; }
    /* the sequencer's 64 steps, and a lane's hits: one each `--every`, `--at` into it */
    #loading .steps { flex: 1; height: 22px; --cell: calc(100% / 64);
      background: repeating-linear-gradient(90deg, transparent 0 var(--at, 0px),
          var(--hit, transparent) 0 calc(var(--at, 0px) + var(--cell) - 3px), transparent 0 var(--every, 100%)),
        repeating-linear-gradient(90deg, var(--block) 0 calc(var(--cell) - 3px), transparent 0 var(--cell)); }

    #loading .side { grid-row: 3 / 5; grid-column: 2; display: flex; flex-direction: column; gap: 10px; padding: 12px;
      background: var(--panel); border-left: 1px solid var(--line-soft); overflow: hidden; }
    /* a panel shorter than what it holds cuts it off at the bottom, as the studio's scroll, rather than squeezing it */
    #loading .arrangement > *, #loading .side > * { flex: none; }
    #loading .field { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; min-height: 26px; }
    /* a field's label, in the inspector's column of labels (`widgets::LABEL_WIDTH`) */
    #loading .label { width: var(--w); height: 10px; margin-right: calc(98px - var(--w)); }
    #loading .chip { height: 22px; border-radius: 11px; }
    #loading .rule { height: 1px; background: var(--line-soft); margin: 6px 0; flex: none; }
    #loading .verdict { display: flex; gap: 18px; align-items: center; }
    #loading .ring { width: 72px; height: 72px; box-sizing: border-box; border-radius: 50%; background: none;
      border: 6px solid var(--block); }
    #loading .bars { flex: 1; display: flex; flex-direction: column; gap: 12px; }
    #loading .bars i { height: 8px; }
    #loading .arrangement, #loading .dock, #loading .side { animation: shine 1.8s ease-in-out infinite; }

    /* how much of the program has arrived: over the arrangement */
    #loading .arriving { grid-row: 3; grid-column: 1; place-self: center; z-index: 1; width: min(320px, 80%);
      padding: 16px 18px 14px; box-sizing: border-box; border-radius: 10px; background: var(--panel);
      border: 1px solid var(--line-soft); box-shadow: 0 10px 30px var(--shadow); }
    #loading .meter { height: 4px; border-radius: 2px; background: var(--line-soft); overflow: hidden; }
    #loading .meter b { display: block; width: 0; height: 100%; border-radius: 2px; background: var(--accent);
      transition: width 0.2s; }
    #loading .said { margin: 10px 0 0; font-variant-numeric: tabular-nums; }
    #loading .help { display: none; margin: 8px 0 0; color: var(--dim); }
    #loading .help a { color: var(--accent); }
    #loading.unsized .meter b { width: 30%; animation: slide 1.4s ease-in-out infinite alternate; }
    #loading.starting .meter b { width: 100%; animation: shine 1.2s ease-in-out infinite; }
    #loading.failed .meter b { width: 100%; background: var(--bad); }
    #loading.failed .said { color: var(--text); }
    #loading.failed .help { display: block; pointer-events: auto; }
    #loading.failed .arrangement, #loading.failed .dock, #loading.failed .side { animation: none; opacity: 0.5; }
    @keyframes shine { 50% { opacity: 0.55; } }
    @keyframes slide { to { transform: translateX(233%); } }
    @media (prefers-reduced-motion: reduce) {
      #loading *, #loading .meter b { animation: none !important; transition: none; }
      #loading.unsized .meter b { width: 100%; opacity: 0.5; }
    }
    @media (max-width: 760px) { #loading { grid-template-columns: minmax(0, 1fr) 290px; } }
  </style>
  <script>
    // How much of the studio's program has arrived, which the meter over the outline shows, and why the studio did
    // not start, when it does not. The page counts the program as it arrives, unpacked: `cargo xtask web` writes how
    // large it is unpacked into `data-bytes`, as a server that compresses it does not say how large it is. The program
    // itself goes to the browser untouched, so the browser can keep it compiled for the next visit. What stops the
    // studio starting is its own files not arriving and its program not compiling or running; any other error the
    // page meets meanwhile is not taken for that.
    (() => {
      const fetched = window.fetch;
      const loading = () => document.getElementById("loading");
      const ours = (url) => /claudius-ui-[^/]*\.(js|wasm)(\?|$)/.test(url || "");
      const wasm = (e) =>
        typeof WebAssembly === "object" &&
        [WebAssembly.CompileError, WebAssembly.LinkError, WebAssembly.RuntimeError].some((t) => e instanceof t);
      const show = (text, state, percent) => {
        const el = loading();
        if (!el || el.classList.contains("failed")) return;
        el.classList.remove("unsized", "starting");
        if (state) el.classList.add(state);
        el.querySelector(".said").textContent = text;
        const meter = el.querySelector(".meter");
        if (percent === undefined) meter.removeAttribute("aria-valuenow");
        else meter.setAttribute("aria-valuenow", String(Math.round(percent)));
        meter.firstElementChild.style.width = percent === undefined ? "" : `${percent}%`;
      };
      const count = async (res) => {
        const sent = res.headers.get("content-encoding") ? 0 : Number(res.headers.get("content-length"));
        const all = Number(loading()?.dataset.bytes) || sent || 0;
        const reader = res.body.getReader();
        let got = 0;
        for (;;) {
          // a connection that drops once the program has begun to arrive ends it here
          const { done, value } = await reader.read().catch((e) => {
            fail(`its program did not arrive: ${e.message || e}`);
            return { done: true };
          });
          if (done) break;
          got += value.length;
          if (all) show(`Loading the studio: ${Math.min(99, Math.floor((100 * got) / all))}%`, "", Math.min(100, (100 * got) / all));
          else show("Loading the studio", "unsized");
        }
        show("Starting the studio", "starting", 100);
      };
      window.fetch = function (input, init) {
        const res = fetched.call(window, input, init);
        const url = input instanceof Request ? input.url : String(input);
        if (/claudius-ui-[^/]*_bg\.wasm(\?|$)/.test(url)) {
          window.fetch = fetched;
          res
            .then(
              (r) => (r.ok ? r.body && count(r.clone()) : fail(`its program did not arrive (${r.status} ${r.statusText})`)),
              (e) => fail(`its program did not arrive: ${e.message || e}`),
            )
            .catch(() => {});
        }
        return res;
      };
      const fail = (why) => {
        const el = loading();
        if (!el) return;
        el.classList.remove("unsized", "starting");
        el.classList.add("failed");
        el.removeAttribute("aria-busy");
        el.querySelector(".meter b").style.width = "";
        const said = el.querySelector(".said");
        said.setAttribute("role", "alert");
        said.textContent = `The studio could not start: ${why}`;
      };
      addEventListener("error", (e) => {
        const file = e.target && (e.target.src || e.target.href);
        if (ours(file)) fail(`${file.split("/").pop()} did not load`);
        // the module that starts it (trunk's, in the page), whose import did not load
        else if (e.target instanceof HTMLScriptElement && e.target.type === "module") fail("its script did not load");
        else if (wasm(e.error)) fail(e.message);
      }, true);
      addEventListener("unhandledrejection", (e) => {
        if (wasm(e.reason)) fail(e.reason.message || String(e.reason));
      });
      if (typeof WebAssembly !== "object") addEventListener("DOMContentLoaded", () => fail("this browser cannot run WebAssembly"));
    })();
  </script>
</head>
