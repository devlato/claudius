<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#101217" />
  <title>Claudius</title>
  <link data-trunk rel="rust" data-bin="claudius-ui" data-wasm-opt="2" />
  <!-- the demo's engine, in a Web Worker of its own: the studio's songs made and rendered in the page -->
  <link data-trunk rel="rust" href="../claudius-web/Cargo.toml" data-bin="claudius-engine" data-type="worker" data-loader-shim data-wasm-opt="2" />
  <!-- the recorder's AudioWorklet, loaded from beside the page -->
  <link data-trunk rel="copy-file" href="record-worklet.js" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #101217; }
    #claudius_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #8f97a4;
      font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="claudius_canvas"></canvas>
  <div id="loading"><p>loading claudius studio...</p></div>
</body>
</html>
