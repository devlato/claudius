[package]
name = "claudius-session"
description = "What a claudius session does to a song: its edits, and the views of it the API shows; shared by the server and the browser's demo"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
base64 = "0.23"
claudius = { path = "../claudius", default-features = false }
claudius-api = { path = "../claudius-api" }
claudius-intent = { path = "../claudius-intent" }
claudius-packs = { path = "../claudius-packs", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# checking the palette's model as it downloads (`meaning`)
sha2 = "0.11"
