[package]
name = "claudius"
description = "An automatic beatmaker that composes like a producer in a DAW: real samples and loops, procedural synthesis, effects, music theory and evolution"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[features]
default = ["ears"]
# earshot's listening models through ONNX Runtime; leave it out where ORT has no build (Intel Macs)
ears = ["dep:earshot"]

[dependencies]
anyhow = "1"
blake3 = "1"
dirs = "7"
hound = "3"
rayon = "1"
realfft = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signalsmith-stretch = "0.1"
earshot = { path = "../earshot", optional = true }
claudius-packs = { path = "../claudius-packs" }
rhai = "1.26"
claudius-decode = { version = "0.2.0", path = "../claudius-decode" }
claudius-encode = { version = "0.2.0", path = "../claudius-encode" }

[dev-dependencies]
criterion = "0.8"
insta = "1"
proptest = "1"

[[bench]]
name = "engine"
harness = false
