[package]
name = "claudius"
description = "An automatic beatmaker that composes like a producer in a DAW: real samples and loops, procedural synthesis, effects, music theory and evolution"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[features]
default = ["ears", "native"]
# earshot's listening models through ONNX Runtime; leave it out where ORT has no build (Intel Macs)
ears = ["dep:earshot"]
# what only a computer of one's own has: downloading packs, the Apple Loops database, stretching loops in time and
# Ogg Vorbis (C and C++ libraries). Without it the engine also builds for the browser (wasm32-unknown-unknown).
native = ["claudius-packs/net", "claudius-encode/vorbis", "dep:rusqlite", "dep:signalsmith-stretch"]

[dependencies]
anyhow = "1"
blake3 = "1"
dirs = "7"
hound = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
png = "0.18"
rayon = "1"
realfft = "3"
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
signalsmith-stretch = { version = "0.1", optional = true }
earshot = { path = "../earshot", optional = true }
claudius-packs = { path = "../claudius-packs", default-features = false }
# without its default runtime-seeded hashing, which needs a random source a browser build lacks
rhai = { version = "1.26", default-features = false, features = ["std"] }
claudius-decode = { version = "0.3.0", path = "../claudius-decode" }
claudius-encode = { version = "0.3.0", path = "../claudius-encode", default-features = false }
# a project's zip stores its files as they are: its audio is compressed already
zip = { version = "9", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# std's clock panics in a browser: the page's instead
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# a project zipped again by hand (Finder, Explorer) is deflated, and claudius opens it; a browser only writes them
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
criterion = "0.8"
insta = "1"
proptest = "1"

[[bench]]
name = "engine"
harness = false
