[package]
name = "claudius-intent"
description = "What the person means: the studio's actions and features found from their own words, on the device"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
# the song a request is read on, and the commands it proposes
claudius-api = { path = "../claudius-api" }
# Needle 3, the small tool-calling model requests are read with too, on its own kernels (MIT; the weights Apache-2.0)
needle-core = "0.3.1"
needle-infer = "0.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
