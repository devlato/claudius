[package]
name = "claudius-api"
description = "Wire types shared by the claudius server, its UI (native + web) and the MCP tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# JSON schemas of the commands, which the MCP server checks a raw command against
schema = ["dep:schemars"]
