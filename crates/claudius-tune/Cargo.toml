[package]
name = "claudius-tune"
description = "Teaching Needle 3 to read claudius's requests: adapters trained on its lessons, in Rust, on the CPU"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
# the tools, the lessons and the readings the adapters are taught and checked with
claudius-intent = { path = "../claudius-intent" }
# Needle 3's weights and tokenizer, read from its .cact (MIT; the weights Apache-2.0)
needle-core = "0.3.1"
needle-infer = { version = "0.3.1", features = ["parallel"] }
# the forward pass with gradients, on the CPU
candle-core = { version = "0.11.1", default-features = false }
candle-nn = { version = "0.11.1", default-features = false }
safetensors = "0.6"
# the adapters are written in half precision, which halves what claudius carries of them
half = "2.7"
anyhow = "1"
libm = "0.2"
num-traits = "0.2"
rayon = "1"
serde_json = "1"
