[package]
name = "claudius-macos"
description = "What a Mac asks of the Claudius app that its window library does not pass on: the files to open"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

# Elsewhere the crate is empty: Windows and Linux start the program with the file to open as its argument.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSAppleEventDescriptor",
    "NSAppleEventManager",
    "NSNotification",
    "NSObject",
    "NSString",
    "NSURL",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication"] }
