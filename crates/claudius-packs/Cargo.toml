[package]
name = "claudius-packs"
description = "Sample packs for claudius: curated permissively licensed instruments and drum kits, Strudel sample maps, multi-sampled playback"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "claudius_packs"
path = "src/lib.rs"

[[bin]]
name = "claudius-packs"
path = "src/bin/claudius-packs.rs"

[features]
default = ["net"]
# installing packs: downloading them
net = ["dep:ureq"]

[dependencies]
anyhow = "1"
claudius-decode = { version = "0.3.0", path = "../claudius-decode" }
claudius-encode = { version = "0.3.0", path = "../claudius-encode", default-features = false }
dirs = "7"
hound = "3"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# std's clock panics in a browser: the page's instead
web-time = "1"

[dev-dependencies]
tempfile = "3"
