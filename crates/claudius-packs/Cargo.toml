[package]
name = "claudius-packs"
description = "Sample packs for claudius: curated permissively licensed instruments and drum kits, Strudel sample maps, multi-sampled playback"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "claudius_packs"
path = "src/lib.rs"

[[bin]]
name = "claudius-packs"
path = "src/bin/claudius-packs.rs"

[dependencies]
anyhow = "1"
claudius-decode = { version = "0.1.0", path = "../claudius-decode" }
dirs = "7"
flacenc = "0.5"
hound = "3"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"
